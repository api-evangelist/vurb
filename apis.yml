name: Vurb
description: Vurb was a mobile search and discovery startup founded in 2011 by Bobby Lo, backed by DCVC
  and Redpoint Ventures. Its card-based mobile app (Vurb Cards, Decks) unified search across partners
  like Yelp, Uber, OpenTable and Netflix, and won TechCrunch Disrupt NY 2014. Snap Inc. (Snapchat)
  acquired Vurb in August 2016 for roughly $110M+, and the product was subsequently taken offline and
  removed from app stores. vurb.com now serves only a shutdown notice. There is no public API,
  developer portal, or documentation surface; this profile is retained as a network record of a
  defunct, acquired company with no API surface to enrich.
